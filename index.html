<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Арта Групп — Центр управления</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet" />
<script src="vendor/react.js"></script>
<script src="vendor/react-dom.js"></script>
<script src="vendor/prop-types.js"></script>
<script src="vendor/recharts.js"></script>
<script src="vendor/babel.js"></script>
<style>
  :root{
    --bg:#F4F5F7; --card:#FFFFFF; --ink:#0F1419; --inksoft:#3B4250; --muted:#6B7280;
    --hair:#E8EAEE; --hairsoft:#EFF1F4;
    --lime:#D4FF3D; --lime-ink:#1A2300;
    --mint:#B8DCC8; --mint-soft:#E5F1EB; --mint-deep:#5C8B73;
    --green:#10B981; --green-soft:#D1FAE5; --green-ink:#0B5C45;
    --red:#FF4D4F; --red-soft:#FFE4E6; --red-ink:#7A1417;
    --amber:#F4B740; --amber-soft:#FFF1CF; --amber-ink:#7A4E00;
    --blue:#2A6FDB; --blue-soft:#DBEAFE; --blue-ink:#1E3A8A;
    --lilac:#8B5CF6; --lilac-soft:#EDE9FE; --lilac-ink:#5B21B6;
    --mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
    --shadow:0 1px 0 rgba(15,20,25,.04), 0 0 0 1px rgba(15,20,25,.05);
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);
    font-family:"Manrope",-apple-system,system-ui,sans-serif;letter-spacing:-0.01em;
    -webkit-font-smoothing:antialiased;}
  ::-webkit-scrollbar{width:10px;height:10px}
  ::-webkit-scrollbar-thumb{background:#d0d4da;border-radius:999px}
  button{font-family:inherit}
  /* ===== shell ===== */
  .shell{max-width:1480px;margin:0 auto;padding:20px 28px 90px 100px;position:relative;min-height:100vh;}
  @media(max-width:900px){ .shell{padding-left:28px} .rail{display:none} }
  .rail{position:fixed;left:max(18px,calc(50vw - 740px + 18px));top:210px;width:52px;display:flex;flex-direction:column;gap:10px;z-index:40;}
  .railbtn{width:48px;height:48px;border-radius:999px;background:#fff;box-shadow:var(--shadow);border:none;cursor:pointer;
    display:flex;align-items:center;justify-content:center;color:var(--inksoft);transition:.15s;position:relative;}
  .railbtn:hover{transform:translateY(-1px);box-shadow:0 4px 14px rgba(15,20,25,.10);}
  .railbtn.active{background:var(--ink);color:#fff;}
  .railbtn .tip{position:absolute;left:58px;top:50%;transform:translateY(-50%);background:var(--ink);color:#fff;
    font-size:12px;font-weight:600;padding:6px 11px;border-radius:9px;white-space:nowrap;opacity:0;pointer-events:none;transition:.15s;}
  .railbtn:hover .tip{opacity:1;}
  .railnum{position:absolute;right:-2px;top:-2px;width:17px;height:17px;border-radius:999px;background:var(--lime);color:var(--lime-ink);
    font-size:10px;font-weight:800;display:flex;align-items:center;justify-content:center;}
  /* ===== topbar ===== */
  .topbar{display:flex;align-items:center;gap:12px;margin-bottom:26px;}
  .logo{width:46px;height:46px;border-radius:14px;background:var(--ink);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:15px;flex-shrink:0;}
  .nav{display:flex;gap:4px;background:#fff;border-radius:999px;padding:6px;box-shadow:var(--shadow);overflow-x:auto;}
  .nav::-webkit-scrollbar{display:none}
  .navpill{border:none;background:transparent;color:var(--ink);font-size:13px;font-weight:600;padding:9px 13px;border-radius:999px;cursor:pointer;white-space:nowrap;transition:.15s;}
  .navpill:hover{background:var(--hairsoft);}
  .navpill.active{background:var(--ink);color:#fff;}
  .navpill .ast{opacity:.55;font-size:11px;margin-left:3px;}
  .search{flex:1;min-width:140px;display:flex;align-items:center;gap:10px;background:#fff;border-radius:999px;padding:11px 18px;box-shadow:var(--shadow);color:var(--muted);font-size:13.5px;white-space:nowrap;overflow:hidden;}
  .search .kbd{margin-left:auto;font-family:var(--mono);font-size:11px;background:var(--hairsoft);border-radius:7px;padding:3px 8px;color:var(--muted);}
  .live{display:flex;align-items:center;gap:8px;background:#fff;border-radius:999px;padding:11px 16px;box-shadow:var(--shadow);font-size:13px;font-weight:700;}
  .live .dot{width:9px;height:9px;border-radius:999px;background:var(--green);position:relative;}
  .live .dot::after{content:"";position:absolute;inset:0;border-radius:999px;background:var(--green);animation:pulse 1.6s infinite;}
  @keyframes pulse{0%{transform:scale(1);opacity:.7}70%{transform:scale(2.1);opacity:0}100%{opacity:0}}
  .avatars{display:flex;align-items:center;}
  .ava{width:34px;height:34px;border-radius:999px;border:2px solid #fff;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;margin-left:-9px;}
  .ava:first-child{margin-left:0}
  .iconbtn{width:44px;height:44px;border-radius:999px;background:#fff;box-shadow:var(--shadow);border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--inksoft);position:relative;flex-shrink:0;}
  .iconbtn .reddot{position:absolute;top:9px;right:10px;width:8px;height:8px;border-radius:999px;background:var(--red);border:2px solid #fff;}
  .profile{width:44px;height:44px;border-radius:999px;background:var(--ink);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px;flex-shrink:0;}
  @media(max-width:1150px){ .search,.live,.avatars{display:none} }
  /* ===== breadcrumbs + header ===== */
  .crumbs{display:flex;align-items:center;gap:9px;font-size:13px;color:var(--muted);margin-bottom:10px;flex-wrap:wrap;}
  .crumbs b{color:var(--ink);font-weight:700;}
  .crumbs .sync{display:inline-flex;align-items:center;gap:7px;background:#fff;border-radius:999px;padding:5px 12px;box-shadow:var(--shadow);font-size:12px;font-weight:600;color:var(--inksoft);}
  .crumbs .sync i{width:7px;height:7px;border-radius:999px;background:var(--green);display:inline-block;}
  .pagehead{display:flex;align-items:flex-end;justify-content:space-between;gap:18px 24px;margin-bottom:26px;flex-wrap:nowrap;}
  .pagehead h1{font-size:clamp(28px,3.2vw,42px);margin:0;font-weight:800;letter-spacing:-0.03em;line-height:1.05;display:flex;align-items:center;gap:14px;flex-wrap:wrap;flex:1 1 auto;min-width:0;}
  .limebadge{background:var(--lime);color:var(--lime-ink);font-size:12.5px;font-weight:800;padding:7px 13px;border-radius:999px;display:inline-flex;align-items:center;gap:7px;letter-spacing:0;white-space:nowrap;}
  .limebadge i{width:7px;height:7px;border-radius:999px;background:var(--lime-ink);display:inline-block;}
  .headctl{display:flex;gap:10px;align-items:center;flex-wrap:wrap;flex-shrink:0;justify-content:flex-end;}
  @media(max-width:820px){ .pagehead{flex-wrap:wrap} .headctl{justify-content:flex-start;} }
  .datepill{background:#fff;border-radius:999px;padding:12px 18px;box-shadow:var(--shadow);font-size:13.5px;font-weight:700;display:flex;align-items:center;gap:9px;}
  .datepill .lbl{color:var(--muted);font-weight:600;}
  .selbare{border:none;background:transparent;font-family:inherit;font-size:13.5px;font-weight:700;color:var(--ink);cursor:pointer;outline:none;padding:0 2px;}
  .dateinp{border:none;background:transparent;font-family:var(--mono);font-size:13px;font-weight:700;color:var(--ink);outline:none;cursor:pointer;padding:0;}
  .dateinp::-webkit-calendar-picker-indicator{opacity:.45;cursor:pointer;}
  .exportbtn{background:var(--ink);color:#fff;border:none;border-radius:999px;padding:13px 22px;font-size:13.5px;font-weight:700;cursor:pointer;display:flex;align-items:center;gap:9px;}
  .exportbtn:hover{opacity:.9}
  /* ===== grid + cards ===== */
  .grid{display:grid;grid-template-columns:repeat(12,1fr);gap:16px;}
  .c2{grid-column:span 2}.c3{grid-column:span 3}.c4{grid-column:span 4}.c5{grid-column:span 5}
  .c6{grid-column:span 6}.c7{grid-column:span 7}.c8{grid-column:span 8}.c9{grid-column:span 9}.c12{grid-column:span 12}
  @media(max-width:1150px){.c2{grid-column:span 4}.c3{grid-column:span 6}.c4{grid-column:span 6}.c5,.c7{grid-column:span 12}.c6{grid-column:span 6}.c8,.c9{grid-column:span 12}}
  @media(max-width:760px){.c2,.c3,.c4,.c6{grid-column:span 12}}
  .card{background:var(--card);border-radius:24px;box-shadow:var(--shadow);padding:22px;position:relative;}
  .card.tight{padding:18px 20px;}
  .ch{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:16px;}
  .ch h3{font-size:16px;margin:0;font-weight:800;letter-spacing:-0.02em;}
  .ch p{font-size:12.5px;margin:4px 0 0;color:var(--muted);font-weight:500;}
  .star{color:var(--muted);font-weight:700;font-size:.65em;vertical-align:super;margin-left:1px;}
  .footnote{font-size:11.5px;color:#9AA0A8;margin-top:10px;line-height:1.5;}
  /* chips */
  .chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;padding:5px 11px;border-radius:999px;white-space:nowrap;}
  .chip i{width:6px;height:6px;border-radius:999px;background:currentColor;display:inline-block;}
  .ch-green{background:var(--green-soft);color:var(--green-ink);}
  .ch-red{background:var(--red-soft);color:var(--red-ink);}
  .ch-amber{background:var(--amber-soft);color:var(--amber-ink);}
  .ch-blue{background:var(--blue-soft);color:var(--blue-ink);}
  .ch-lilac{background:var(--lilac-soft);color:var(--lilac-ink);}
  .ch-gray{background:var(--hairsoft);color:var(--muted);}
  .ch-lime{background:var(--lime);color:var(--lime-ink);}
  .ch-mint{background:var(--mint-soft);color:var(--mint-deep);}
  /* подсказка «?» — как считается показатель и откуда данные */
  .hint{display:inline-flex;align-items:center;justify-content:center;width:15px;height:15px;border-radius:999px;
    background:var(--hairsoft);color:var(--muted);font-size:10px;font-weight:800;margin-left:5px;cursor:help;
    position:relative;vertical-align:middle;flex-shrink:0;font-family:var(--mono);}
  .hint:hover{background:var(--ink);color:#fff;}
  .hint .hbox{position:fixed;width:290px;
    background:var(--ink);color:#fff;font-family:"Manrope",sans-serif;font-size:12px;font-weight:500;line-height:1.5;
    letter-spacing:0;padding:11px 13px;border-radius:12px;opacity:0;pointer-events:none;transition:.15s;z-index:90;
    text-align:left;text-transform:none;box-shadow:0 8px 28px rgba(15,20,25,.22);}
  .hint .hbox b{color:var(--lime);font-weight:700;}
  .hint .hbox .src{display:block;margin-top:6px;color:#9AA0A8;font-size:11px;}
  .hint.on .hbox{opacity:1;}
  .ch-base{background:var(--green-soft);color:var(--green-ink);}
  .ch-opt{background:var(--lilac-soft);color:var(--lilac-ink);}
  .ch-base i,.ch-opt i{display:none;}
  /* hero */
  .hero .hlabel{display:flex;align-items:center;gap:9px;font-size:13.5px;font-weight:700;color:var(--inksoft);}
  .hero .hlabel i{width:8px;height:8px;border-radius:999px;background:var(--green);}
  .hero .hnum{font-size:clamp(44px,4.6vw,62px);font-weight:800;letter-spacing:-0.04em;line-height:1;margin:14px 0 4px;font-feature-settings:"tnum";}
  .hero .hunit{font-size:14px;color:var(--muted);font-weight:600;}
  .hero .hchips{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px;}
  /* kcard — компактная метрика */
  .kcard{background:var(--card);border-radius:24px;box-shadow:var(--shadow);padding:20px;display:flex;flex-direction:column;gap:10px;}
  .kcard .kt{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:13px;font-weight:600;color:var(--muted);}
  .kcard .kv{font-size:30px;font-weight:800;letter-spacing:-0.03em;line-height:1;font-feature-settings:"tnum";}
  .kcard .kchips{display:flex;gap:6px;flex-wrap:wrap;}
  .kcard .kchips .chip{font-size:11px;padding:4px 9px;}
  .kcard .knote{font-size:12px;color:var(--muted);font-weight:500;}
  .krow{display:grid;gap:16px;margin-bottom:16px;}
  .krow.n4{grid-template-columns:repeat(4,1fr);}
  .krow.n5{grid-template-columns:repeat(5,1fr);}
  .krow.n6{grid-template-columns:repeat(6,1fr);}
  @media(max-width:1150px){.krow.n4,.krow.n5,.krow.n6{grid-template-columns:repeat(3,1fr)}}
  @media(max-width:700px){.krow.n4,.krow.n5,.krow.n6{grid-template-columns:repeat(2,1fr)}}
  /* pastel mp tiles */
  .tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;}
  @media(max-width:760px){.tiles{grid-template-columns:1fr}}
  .tile{border-radius:20px;padding:18px;display:flex;flex-direction:column;gap:6px;}
  .tile .tn{font-size:13.5px;font-weight:800;display:flex;align-items:center;gap:9px;}
  .tile .tn svg{flex-shrink:0}
  .tile .tv{font-size:26px;font-weight:800;letter-spacing:-0.03em;font-feature-settings:"tnum";}
  .tile .ts{font-size:12px;font-weight:600;opacity:.75;}
  .t-blue{background:var(--blue-soft);color:var(--blue-ink);}
  .t-lilac{background:var(--lilac-soft);color:var(--lilac-ink);}
  .t-yellow{background:var(--amber-soft);color:var(--amber-ink);}
  /* tables */
  table{width:100%;border-collapse:collapse;font-size:13.5px;}
  th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);font-weight:700;padding:9px 12px;border-bottom:1px solid var(--hair);}
  td{padding:13px 12px;border-bottom:1px solid var(--hairsoft);}
  tr:last-child td{border-bottom:none;}
  .num{text-align:right;font-variant-numeric:tabular-nums;font-family:var(--mono);font-size:12.5px;white-space:nowrap;}
  .row-warn td{background:var(--red-soft);}
  .row-warn td:first-child{border-radius:12px 0 0 12px;}
  .row-warn td:last-child{border-radius:0 12px 12px 0;}
  .ctag{display:inline-block;font-size:10.5px;font-weight:800;padding:3px 9px;border-radius:7px;background:var(--hairsoft);color:var(--muted);letter-spacing:.3px;}
  table.pl td{padding:11px 12px;}
  table.pl tr.pl-sub td{background:var(--hairsoft);font-weight:800;}
  table.pl tr.pl-sub td:first-child{border-radius:10px 0 0 10px;}
  table.pl tr.pl-sub td:last-child{border-radius:0 10px 10px 0;}
  table.pl tr.pl-net td{background:var(--lime);font-weight:800;color:var(--lime-ink);}
  table.pl tr.pl-net td:first-child{border-radius:10px 0 0 10px;}
  table.pl tr.pl-net td:last-child{border-radius:0 10px 10px 0;}
  table.pl tr.pl-net td.num{color:var(--lime-ink);}
  table.pl td.ded{color:var(--muted);}
  /* feed (события / алёрты) */
  .feed{display:flex;flex-direction:column;}
  .fitem{display:flex;gap:14px;padding:11px 0;position:relative;cursor:default;}
  .fitem.clk{cursor:pointer;border-radius:14px;}
  .fitem.clk:hover{background:var(--hairsoft);margin:0 -10px;padding-left:10px;padding-right:10px;}
  .fic{width:38px;height:38px;border-radius:999px;display:flex;align-items:center;justify-content:center;flex-shrink:0;position:relative;z-index:1;}
  .fitem:not(:last-child) .fic::after{content:"";position:absolute;top:40px;left:50%;width:2px;height:26px;background:var(--hairsoft);}
  .ft{flex:1;min-width:0;}
  .ft .t1{font-size:13.5px;font-weight:700;line-height:1.35;}
  .ft .t2{font-size:12.5px;color:var(--muted);margin-top:2px;line-height:1.4;}
  .ftime{font-family:var(--mono);font-size:11.5px;color:var(--muted);flex-shrink:0;padding-top:2px;}
  .f-green{background:var(--green-soft);color:var(--green-ink);}
  .f-red{background:var(--red-soft);color:var(--red-ink);}
  .f-amber{background:var(--amber-soft);color:var(--amber-ink);}
  .f-blue{background:var(--blue-soft);color:var(--blue-ink);}
  .f-ink{background:var(--ink);color:#fff;}
  /* controls */
  .toggle{display:flex;gap:6px;flex-wrap:wrap;}
  .tg{border:none;background:#fff;box-shadow:var(--shadow);border-radius:999px;padding:8px 15px;font-size:12.5px;font-weight:700;color:var(--inksoft);cursor:pointer;transition:.12s;}
  .tg:hover{background:var(--hairsoft);}
  .tg.active{background:var(--ink);color:#fff;box-shadow:none;}
  .sel{font-family:inherit;font-size:13px;font-weight:600;color:var(--ink);border:none;box-shadow:var(--shadow);background:#fff;border-radius:999px;padding:10px 16px;cursor:pointer;}
  input.sel{cursor:text;}
  .btn{font-family:inherit;font-size:13px;font-weight:700;color:#fff;background:var(--ink);border:none;border-radius:999px;padding:11px 19px;cursor:pointer;display:inline-flex;align-items:center;gap:8px;}
  .btn:hover{opacity:.9}
  .btn.lime{background:var(--lime);color:var(--lime-ink);}
  input[type=range]{width:100%;accent-color:var(--ink);height:6px;}
  /* recs */
  .rec{display:flex;gap:12px;align-items:flex-start;padding:13px 15px;border-radius:16px;background:var(--hairsoft);font-size:13px;line-height:1.45;margin-bottom:9px;font-weight:500;}
  .rec:last-child{margin-bottom:0;}
  .rec .rtag{font-size:10px;font-weight:800;letter-spacing:.4px;padding:4px 9px;border-radius:8px;flex-shrink:0;white-space:nowrap;margin-top:1px;}
  /* compbar (юнит-экономика) */
  .compbar{display:flex;height:44px;border-radius:14px;overflow:hidden;margin:12px 0;}
  .compbar .seg{display:flex;align-items:center;justify-content:center;color:#fff;font-size:11.5px;font-weight:800;min-width:0;white-space:nowrap;overflow:hidden;}
  .leg{display:flex;gap:16px;flex-wrap:wrap;font-size:12.5px;margin-top:6px;}
  .leg span{display:flex;align-items:center;gap:7px;color:var(--muted);font-weight:600;}
  .leg i{width:11px;height:11px;border-radius:4px;display:inline-block;}
  /* mini stat cells */
  .cells{display:grid;gap:12px;}
  .cell{background:var(--hairsoft);border-radius:16px;padding:14px 16px;}
  .cell .l{font-size:12px;color:var(--muted);font-weight:600;}
  .cell .b{font-size:22px;font-weight:800;margin-top:5px;letter-spacing:-0.02em;font-feature-settings:"tnum";}
  .cell .d{font-size:12px;font-weight:600;margin-top:3px;color:var(--muted);}
  /* chain */
  .chain{display:flex;align-items:stretch;gap:0;flex-wrap:wrap;}
  .cnode{flex:1;min-width:210px;border-radius:18px;padding:18px;cursor:pointer;transition:.18s;border:2px solid transparent;}
  .carrow{display:flex;align-items:center;justify-content:center;width:44px;font-size:20px;color:#C2C7CF;}
  .cnode h4{margin:0 0 6px;font-size:14px;font-weight:800;}
  .cnode p{margin:0;font-size:12.5px;line-height:1.45;color:var(--muted);font-weight:500;}
  .cnode .tag{font-size:10.5px;font-weight:800;letter-spacing:.5px;}
  .cn-a{background:var(--lilac-soft);} .cn-a.hot{border-color:var(--lilac);}
  .cn-b{background:var(--blue-soft);} .cn-b.hot{border-color:var(--blue);}
  .cn-c{background:var(--amber-soft);} .cn-c.hot{border-color:var(--amber);}
  /* inbox (коммуникация) */
  .inbox{display:grid;grid-template-columns:250px 360px 1fr;gap:16px;align-items:start;}
  @media(max-width:1150px){.inbox{grid-template-columns:1fr}}
  .chanlist{display:flex;flex-direction:column;gap:4px;}
  .chan{display:flex;align-items:center;gap:11px;padding:11px 13px;border-radius:14px;border:none;background:transparent;cursor:pointer;font-size:13.5px;font-weight:700;color:var(--inksoft);text-align:left;width:100%;}
  .chan:hover{background:var(--hairsoft);}
  .chan.active{background:var(--ink);color:#fff;}
  .chan .cic{width:34px;height:34px;border-radius:11px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .chan .cnt{margin-left:auto;font-family:var(--mono);font-size:11.5px;font-weight:700;background:var(--hairsoft);color:var(--muted);border-radius:999px;padding:2px 9px;}
  .chan.active .cnt{background:rgba(255,255,255,.18);color:#fff;}
  .chanhdr{font-size:10.5px;font-weight:800;letter-spacing:.6px;color:var(--muted);padding:14px 13px 6px;}
  .dlg{padding:14px;border-radius:16px;cursor:pointer;border-left:3px solid transparent;}
  .dlg:hover{background:var(--hairsoft);}
  .dlg.active{background:var(--hairsoft);border-left-color:var(--ink);}
  .dlg .dh{display:flex;justify-content:space-between;gap:10px;align-items:baseline;}
  .dlg .dh b{font-size:13.5px;}

const CHECK_MOD=[1.35,1.40,1.45,1.50,1.50,1.40,1.25,1.10,1.00,.95,.92,.90,.90,.92,.95,.98,1.00,1.02,1.05,1.08,1.10,1.15,1.25,1.30];

/* детерминированный генератор почасового ряда: units по профилю, ₽ через модификатор чека, нормировано в суточный итог */
function hourSeries(key, factor, wob){
  const pf=HOUR_PROFILE[key], sum=pf.reduce((a,b)=>a+b,0), T=ORDERS_DAY_TOTALS[key];
  const units=pf.map((s,h)=>Math.round(T.units*factor*(s/sum)*wob[h]));
  const raw=units.map((u,h)=>u*CHECK_MOD[h]);
  const rawSum=raw.reduce((a,b)=>a+b,0)||1, target=T.rub*factor;
  return units.map((u,h)=>({h, units:u, rub:Math.round(raw[h]/rawSum*target)}));
}

  const t=hourSeries(key,1,WOB_T), y=hourSeries(key,.94,WOB_Y), w=hourSeries(key,.82,WOB_W);

    tU: r.h<=NOW_HOUR?r.units:null, tR: r.h<=NOW_HOUR?r.rub:null,   // сегодня обрывается на текущем часе (не заливаем нулями)
    yU: y[i].units, yR: y[i].rub, wU: w[i].units, wR: w[i].rub }));
}

/* производные показатели месяца — считаются, а не задаются, чтобы всё сходилось */
function plCalc(m){
  const gross = m.rev - m.cogs;                    // валовая прибыль
  const ebitda = gross - m.comm - m.admin;         // операционная прибыль (EBITDA)
  const pretax = ebitda + m.oi - m.oe;             // прибыль до налогообложения
  const net = pretax - m.tax;                      // чистая прибыль
  const final = net - m.pe;                        // прибыль с учётом расходов за счёт прибыли
  const total = m.cogs + m.comm + m.admin;         // всего затраты
  return {...m, gross, ebitda, pretax, net, final, total};
}
/* какие месяцы попадают в выбранный период */
function monthsOf(period){
  if(!period) return Y2026;
  if(period.pk==="ytd") return Y2026;
  const one = Y2026.find(m=>m.k===period.pk);
  if(one) return [one];
  if(period.from && period.to){                    // произвольный диапазон -> по номерам месяцев
    const a=+period.from.slice(5,7), b=+period.to.slice(5,7);
    const sel=Y2026.filter(m=>{const i=+m.k.slice(1); return i>=a && i<=b;});
    if(sel.length) return sel;
  }
  return Y2026;
}
/* сумма показателей за период */
function plSum(ms){
  const z={rev:0,cogs:0,comm:0,admin:0,oi:0,oe:0,tax:0,pe:0,units:0,planRev:0,prevRev:0};
  ms.forEach(m=>Object.keys(z).forEach(k=>z[k]+=m[k]));
  return plCalc(z);
}

function downloadExcel(filename, headers, rows){
  let html='<table border="1"><tr>'+headers.map(h=>'<th>'+h+'</th>').join('')+'</tr>';
  rows.forEach(r=>{ html+='<tr>'+r.map(c=>'<td>'+c+'</td>').join('')+'</tr>'; });
  html+='</table>';
  const blob=new Blob(['﻿<html><head><meta charset="utf-8"></head><body>'+html+'</body></html>'],{type:'application/vnd.ms-excel'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a'); a.href=url; a.download=filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a); URL.revokeObjectURL(url);
}

function Tag({tag}){
  if(!tag) return null;
  return <span className={"chip ch-"+(tag==="opt"?"opt":"base")} style={{fontSize:10,fontWeight:800,letterSpacing:.4,padding:"3px 8px"}}>{tag==="opt"?"ОПЦИЯ":"БАЗА"}</span>;
}
function Card({title, subtitle, gen, col, right, children, tight, tag}){
  return (
    <div className={"card"+(tight?" tight":"")+(col?" c"+col:"")}>
      {(title||right||tag) && <div className="ch">
        <div>{title && <h3>{title}{gen && <span className="star">*</span>}</h3>}{subtitle && <p>{subtitle}</p>}</div>
        <div style={{display:'flex',alignItems:'center',gap:8,flexShrink:0}}>{right}{tag && <Tag tag={tag}/>}</div>
      </div>}
      {children}
      {gen && <p className="footnote">{GEN_NOTE}</p>}
    </div>
  );
}
function Chip({tone, children}){ return <span className={"chip ch-"+(tone||"gray")}>{children}</span>; }
function DChip({d, unit, betterUp, label}){
  if(d==null) return null;
  const good = d===0?null:((d>0)===betterUp);
  const tone = good==null?"gray":good?"green":"red";
  const arrow = d>0?"↑":d<0?"↓":"→";
  const sign = d>0?"+":d<0?"−":"";
  return <span className={"chip ch-"+tone}>{arrow} {sign}{ru(Math.abs(d),Math.abs(d)%1?1:0)}{unit}{label?" "+label:""}</span>;
}
function KCard({title, value, gen, chips, note, col}){
  return (
    <div className={"kcard"+(col?" c"+col:"")}>
      <div className="kt"><span>{title}</span></div>
      <div className="kv">{value}{gen && <span className="star">*</span>}</div>
      {chips && <div className="kchips">{chips}</div>}
      {note && <div className="knote">{note}</div>}
    </div>
  );
}
function Recs({items}){
  const tm={red:["var(--red-soft)","var(--red-ink)","РИСК"],amber:["var(--amber-soft)","var(--amber-ink)","ВНИМАНИЕ"],
    green:["var(--green-soft)","var(--green-ink)","РОСТ"],blue:["var(--blue-soft)","var(--blue-ink)","ДЕЙСТВИЕ"]};
  return <div>{items.map((r,i)=>{const t=tm[r.tone]||tm.blue;
    return <div className="rec" key={i}><span className="rtag" style={{background:t[0],color:t[1]}}>{r.tag||t[2]}</span><div>{r.text}</div></div>;})}</div>;
}

/* ===================== ЭТАП 1 · ЮНИТ-ЭКОНОМИКА ===================== */
function S1_Unit(){
  const [sku,setSku]=useState(UNIT_ECON_GEN[0].sku);
  const [q,setQ]=useState("");
  const found=UNIT_ECON_GEN.filter(x=>x.sku.toLowerCase().includes(q.trim().toLowerCase()));
  const u=UNIT_ECON_GEN.find(x=>x.sku===sku);
  const holds=u.commission+u.logistics+u.ads+u.acquiring;
  const payout=u.price-holds;
  const profit=payout-u.cost;
  const marginPct=profit/u.price*100;
  const seg=[
    { l:"Себестоимость", v:u.cost, c:"#0F1419" },
    { l:"Комиссия МП", v:u.commission, c:"#FF4D4F" },
    { l:"Логистика", v:u.logistics, c:"#F4B740" },
    { l:"Реклама", v:u.ads, c:"#8B5CF6" },
    { l:"Эквайринг", v:u.acquiring, c:"#9AA0A8" },
    { l:"Прибыль", v:Math.max(profit,0), c:"#10B981" },
  ];
  const exportXls=()=>{
    const headers=["SKU","Цена ₽","Удержания ₽","Выплата ₽","Себестоимость ₽","Прибыль/ед ₽","Маржа %"];
    const rows=UNIT_ECON_GEN.map(x=>{const h=x.commission+x.logistics+x.ads+x.acquiring,p=x.price-h,pr=p-x.cost;
      return [x.sku,x.price,h,p,x.cost,pr,(pr/x.price*100).toFixed(1).replace('.',',')];});
    downloadExcel("unit-economics-arta.xls", headers, rows);
  };
  return (
    <div className="grid">
      <Card col={12} gen title="Разбор цены по товару" subtitle="из чего складывается прибыль с единицы"
        right={<div style={{display:'flex',gap:9,flexWrap:'wrap'}}>
          <input className="sel" style={{minWidth:230}} type="text" placeholder="поиск товара…" value={q} onChange={e=>setQ(e.target.value)}/>
          <select className="sel" value={sku} onChange={e=>setSku(e.target.value)}>
            {found.map((x,i)=><option key={i} value={x.sku}>{x.sku}</option>)}
          </select>
        </div>}>
        <div className="compbar">
          {seg.filter(s=>s.v>0).map((s,i)=>(
            <div key={i} className="seg" style={{flex:s.v,background:s.c}} title={s.l+": "+s.v+" ₽"}>{s.v>=10?s.v+" ₽":""}</div>))}
        </div>
        <div className="leg">{seg.map((s,i)=>(<span key={i}><i style={{background:s.c}}/>{s.l} · {ru(s.v)} ₽</span>))}</div>
        {profit<0 && <div className="rec" style={{marginTop:12,background:"var(--red-soft)"}}><span className="rtag" style={{background:"#fff",color:"var(--red-ink)"}}>УБЫТОК</span>
          <div>Выплата после МП ({ru(payout)} ₽) ниже себестоимости ({ru(u.cost)} ₽) — минус {ru(Math.abs(profit))} ₽ с единицы.</div></div>}
      </Card>

      <div className="c12"><div className="krow n4" style={{marginBottom:0}}>
        <KCard gen title="Цена розничная" value={rub(u.price)} note="цена на площадке"/>
        <KCard gen title="Удержания МП" value={rub(holds)} note={"≈ "+Math.round(holds/u.price*100)+"% от цены"} chips={<Chip tone="amber">внимание</Chip>}/>
        <KCard gen title="Выплата после МП" value={rub(payout)} note="приходит на счёт"/>
        <KCard gen title="Прибыль с единицы" value={(profit>0?"+":"")+rub(profit)} note={"маржа "+ru(marginPct,1)+" %"}
          chips={profit<0?<Chip tone="red">убыток</Chip>:marginPct<8?<Chip tone="amber">на грани</Chip>:<Chip tone="green">норма</Chip>}/>
      </div></div>

      <Card col={12} gen title="Сводная по всем SKU" subtitle="цена, удержания, выплата, себестоимость и прибыль с единицы"
        right={<button className="btn" onClick={exportXls}>{I.dl}Скачать Excel</button>}>
        <table>
          <thead><tr><th>SKU</th><th className="num">Цена</th><th className="num">Удержания</th><th className="num">Выплата</th><th className="num">Себест.</th><th className="num">Прибыль/ед</th><th className="num">Маржа</th><th>Статус</th></tr></thead>
          <tbody>
            {UNIT_ECON_GEN.map((x,i)=>{
              const h=x.commission+x.logistics+x.ads+x.acquiring, p=x.price-h, pr=p-x.cost, m=pr/x.price*100;
              return <tr key={i} className={pr<0?"row-warn":""}>
                <td style={{fontWeight:700}}>{x.sku}</td><td className="num">{ru(x.price)} ₽</td><td className="num">{ru(h)} ₽</td><td className="num">{ru(p)} ₽</td><td className="num">{ru(x.cost)} ₽</td>
                <td className="num"><b style={{color:pr<0?'var(--red)':'var(--green)'}}>{pr>0?"+":""}{ru(pr)} ₽</b></td>
                <td className="num">{ru(m,1)} %</td>
                <td>{pr<0?<Chip tone="red">убыток</Chip>:m<8?<Chip tone="amber">на грани</Chip>:<Chip tone="green">прибыль</Chip>}</td>
              </tr>;})}
          </tbody>
        </table>
      </Card>
    </div>
  );
}

/* --- расчёты отдельными функциями (не внутри JSX) --- */
const ORDERS_TODAY = "2026-05-29";                 // «сегодня» для демо (детерминированно, без new Date())
const ORD_PERIODS=[
  { k:"today", n:"Сегодня", days:1 }, { k:"yest", n:"Вчера", days:1 },
  { k:"d7", n:"7 дней", days:7 },   { k:"d14", n:"14 дней", days:14 },
  { k:"d30", n:"30 дней", days:30 },{ k:"d90", n:"90 дней", days:90 },
  { k:"d180", n:"180 дней", days:180 },
  { k:"m07", n:"Июль 2026", from:"2026-07-01", to:"2026-07-31" },
  { k:"m06", n:"Июнь 2026", from:"2026-06-01", to:"2026-06-30" },
  { k:"m05", n:"Май 2026", from:"2026-05-01", to:"2026-05-31" },
  { k:"m04", n:"Апрель 2026", from:"2026-04-01", to:"2026-04-30" },
  { k:"m03", n:"Март 2026", from:"2026-03-01", to:"2026-03-31" },
  { k:"m02", n:"Февраль 2026", from:"2026-02-01", to:"2026-02-28" },
  { k:"m01", n:"Январь 2026", from:"2026-01-01", to:"2026-01-31" },
  { k:"ytd", n:"Январь–Июль 2026", from:"2026-01-01", to:"2026-07-31" },
  { k:"custom", n:"Произвольный", days:null },
];
const ORD_PLATFORMS=[["ozon","Ozon"],["wb","Wildberries"],["yandex","Яндекс Маркет"]];
/* --- работа с датами периода --- */
const ordISO=(d)=>d.toISOString().slice(0,10);
const ruDate=(iso)=>{ if(!iso) return "—"; const [y,m,d]=iso.split('-'); return d+'.'+m+'.'+y; };
function ordRangeFor(pk){                          // пресет → диапазон дат
  const preset=ORD_PERIODS.find(x=>x.k===pk);
  if(preset && preset.from) return { from:preset.from, to:preset.to };   // месяц / 4 мес — явный диапазон
  const end=new Date(ORDERS_TODAY+"T12:00:00"), start=new Date(ORDERS_TODAY+"T12:00:00");
  if(pk==="yest"){ end.setDate(end.getDate()-1); start.setDate(start.getDate()-1); }
  else { const d=(preset&&preset.days)||1; start.setDate(start.getDate()-(d-1)); }
  return { from: ordISO(start), to: ordISO(end) };
}
function ordDaysBetween(from,to){                  // произвольный диапазон → число дней
  if(!from||!to) return 1;
  const d=Math.round((new Date(to)-new Date(from))/86400000)+1;
  return d>0?d:1;
}
/* ряд по площадке. days===1 → 3 линии (сегодня/вчера/неделю назад); иначе 2 (текущий/предыдущий период) */
function ordSeries(key, days, isToday){
  const src=ORDERS_HOURLY_GEN[key];
  if(days===1){
    return src.map(r=>({ h:r.h, hh:r.hh,
      aU: isToday?r.tU:r.yU, aR: isToday?r.tR:r.yR,      // «сегодня» обрывается на текущем часе, «вчера» — целиком
      bU: isToday?r.yU:r.wU, bR: isToday?r.yR:r.wR,
      cU: r.wU, cR: r.wR }));
  }
  return src.map(r=>({ h:r.h, hh:r.hh,                   // за период: суммарно по дням
    aU: Math.round(r.yU*days), aR: Math.round(r.yR*days),
    bU: Math.round(r.yU*days*0.93), bR: Math.round(r.yR*days*0.93) }));
}
function ordToCum(rows, keys){
  const acc={}; keys.forEach(k=>acc[k]=0);
  return rows.map(r=>{ const o={...r};
    keys.forEach(k=>{ if(r[k]==null){o[k]=null;} else {acc[k]+=r[k]; o[k]=acc[k];} });
    return o; });
}
/* пиковое окно: скользящее окно N часов подряд с максимальной суммой */
function ordPeakWindow(rows, key, size){
  let best={sum:-1,start:0};
  for(let s=0;s<=24-size;s++){ let sum=0; for(let i=0;i<size;i++) sum+=rows[s+i][key]||0;
    if(sum>best.sum) best={sum,start:s}; }
  return best;
}
/* мёртвые часы: считаются по данным, а не задаются руками —
   час считается мёртвым, если объём в нём меньше половины среднечасового за период */
function ordDeadHours(rows, key){
  const filled=rows.filter(r=>r[key]!=null);
  const total=filled.reduce((a,r)=>a+(r[key]||0),0);
  const avg = filled.length? total/filled.length : 0;
  const hours=filled.filter(r=>(r[key]||0) < avg*0.5).map(r=>r.h);
  const share = total? hours.reduce((a,h)=>a+(rows[h][key]||0),0)/total*100 : 0;
  return { hours, share, avg, threshold: avg*0.5 };
}
/* «01, 03–06» — компактная запись списка часов */
function fmtHourRanges(hs){
  if(!hs.length) return "—";
  const p=(x)=>String(x).padStart(2,'0');
  const out=[]; let s=hs[0], prev=hs[0];
  for(let i=1;i<=hs.length;i++){ const c=hs[i];
    if(c===prev+1){ prev=c; continue; }
    out.push(s===prev? p(s) : p(s)+"–"+p(prev+1));
    s=c; prev=c; }
  return out.join(", ");
}
const heatColor=(t)=>{ const c0=[244,245,247], c1=[16,185,129];
  const c=c0.map((v,i)=>Math.round(v+(c1[i]-v)*Math.pow(Math.max(0,Math.min(1,t)),0.75)));
  return `rgb(${c[0]},${c[1]},${c[2]})`; };

/* подсказка «как считается и откуда данные» — у каждого показателя */
function Hint({f, src}){
  const [pos,setPos]=useState(null);
  const show=(e)=>{
    const r=e.currentTarget.getBoundingClientRect(), W=290, M=12;
    const VW=window.innerWidth||document.documentElement.clientWidth||document.body.scrollWidth||1440;
    const VH=window.innerHeight||document.documentElement.clientHeight||900;
    let left=r.left+r.width/2-W/2;                       // по центру иконки
    left=Math.max(M, Math.min(left, VW-W-M));   // не выходим за края экрана
    const above=r.top>230;                               // сверху, если есть место
    setPos({left, top:above?undefined:r.bottom+8, bottom:above?(VH-r.top+8):undefined});
  };
  return (
    <span className={"hint"+(pos?" on":"")} tabIndex={0}
      onMouseEnter={show} onMouseLeave={()=>setPos(null)} onFocus={show} onBlur={()=>setPos(null)}>?
      {pos && <span className="hbox" style={pos}><b>Как считается:</b> {f}
        {src && <span className="src">Источник: {src}</span>}
      </span>}
    </span>
  );
}
/* карточка показателя с подсказкой */
function MCard({t, v, sub, hint, src, tone, go, onGo, demo}){
  return (
    <div className="kcard" style={{cursor:go?'pointer':'default'}} onClick={go&&onGo?()=>onGo(go[0],go[1]):undefined}>
      <div className="kt"><span>{t}{hint && <Hint f={hint} src={src}/>}</span></div>
      <div className="kv">{v}{demo && <span className="star">*</span>}</div>
      {sub && <div className="kchips">{typeof sub==="string" ? <Chip tone={tone||"gray"}>{sub}</Chip> : sub}</div>}
    </div>
  );
}

function S2_Overview({go, period}){

  const cashOut = T.rev * CF_OUT.reduce((a,b)=>a+b.pct,0)/100;
  const opFlow  = cashIn - cashOut;
  const otherFlow = T.rev * CF_OTHER.reduce((a,b)=>a+b.pct,0)/100;
  const cashEnd = CF_START + opFlow + otherFlow;
  const yoy = T.prevRev? (T.rev-T.prevRev)/T.prevRev*100 : null;

        <MCard t="Чистая прибыль" v={mln(T.net)} go={[2,"pl"]} onGo={go}

      </div></div>

      <div className="c12"><div className="krow n4" style={{marginBottom:0}}>

                       : {type:"ok", text:"План продаж выполнен: "+ru(planExec,0)+" %", sub:"Факт "+mln(T.rev)+" при плане "+mln(T.planRev), go:[2,"sales"]},

                   : {type:"ok", text:"Положительный операционный денежный поток", sub:"+"+ru(opFlow,1)+" млн ₽ от основной деятельности", go:[2,"cf"]},

        ]}/>
      </Card>
    </div>
  );
}

function PLStatement({T}){
  const [open,setOpen]=useState({});
  const toggle=k=>setOpen(o=>({...o,[k]:!o[k]}));
  const rows=plRows(T);
  const f=(v)=>(v<0?"−":"")+ru(Math.abs(v),2);
  const share=(v)=>ru(Math.abs(v)/T.rev*100,1)+" %";
  return (
    <table className="pl">
      <thead><tr><th>Статья</th><th className="num">Сумма, млн ₽</th><th className="num">Доля от выручки</th></tr></thead>
      <tbody>
        {rows.map((r,i)=>{
          const isGrp=(r.kind==="grp") && r.items && r.items.length;
          const opened=open[r.l];
          const cls=(r.kind==="sub"||r.kind==="final"||r.kind==="subneg")?"pl-sub":r.kind==="net"?"pl-net":"";
          const bold=["sub","net","final","in","subneg"].includes(r.kind);
          if(r.kind==="pct") return (
            <tr key={i}>
              <td style={{fontWeight:600,color:"var(--muted)",paddingLeft:12,fontSize:12.5}}>{r.l}{r.hint && <Hint f={r.hint} src={SRC_PL}/>}</td>
              <td className="num" style={{color:"var(--muted)"}}>—</td>
              <td className="num"><b>{ru(r.pctVal,1)} %</b></td>
            </tr>);
          return (
            <React.Fragment key={i}>
              <tr className={cls} style={isGrp?{cursor:'pointer'}:{}} onClick={isGrp?()=>toggle(r.l):undefined}>
                <td style={{fontWeight:bold?800:600}}>
                  {isGrp && <span style={{display:'inline-block',width:15,color:'var(--muted)'}}>{opened?"▾":"▸"}</span>}
                  {!isGrp && r.kind!=="in" && <span style={{display:'inline-block',width:15}}/>}
                  {r.l}{r.hint && <Hint f={r.hint} src={SRC_PL}/>}
                </td>
                <td className="num"><b>{f(r.v)}</b></td>
                <td className="num" style={{color:"var(--muted)"}}>{r.v===0?"—":share(r.v)}</td>
              </tr>
              {isGrp && opened && r.items.map((it,j)=>(
                <tr key={j}>
                  <td style={{paddingLeft:38,color:'var(--muted)',fontSize:12.5}}>{it.l}</td>
                  <td className="num" style={{color:'var(--muted)',fontSize:12.5}}>{f(it.v)}</td>
                  <td className="num" style={{color:'var(--muted)',fontSize:12.5}}>{share(it.v)}</td>
                </tr>))}
            </React.Fragment>);
        })}
      </tbody>
    </table>
  );
}

function S2_CashFlow({period}){
  const ms=monthsOf(period), T=plSum(ms);
  const label = ms.length===1 ? ms[0].n+" 2026" : ms[0].n+"–"+ms[ms.length-1].n+" 2026";
  const rub_=(pct_)=>T.rev*pct_/100;
  const inRows=CF_IN.map(r=>({...r, v:rub_(r.pct)}));
  const outRows=CF_OUT.map(r=>({...r, v:rub_(r.pct)}));
  /* округляем до 0,1 млн на уровне расчёта, чтобы суммы в таблице и карточках сходились без «хвостов» */
  const r1=(x)=>Math.round(x*10)/10;
  const inSum=r1(inRows.reduce((a,b)=>a+b.v,0)), outSum=r1(outRows.reduce((a,b)=>a+b.v,0));
  const opFlow=r1(inSum-outSum);
  const dev=CF_OTHER.filter(r=>r.grp==="Развитие").map(r=>({...r,v:r1(rub_(r.pct))}));
  const cred=CF_OTHER.filter(r=>r.grp==="Кредиты").map(r=>({...r,v:r1(rub_(r.pct))}));
  const devSum=r1(dev.reduce((a,b)=>a+b.v,0)), credSum=r1(cred.reduce((a,b)=>a+b.v,0));
  const inAll  = r1(inSum + cred.filter(r=>r.v>0).reduce((a,b)=>a+b.v,0));
  const outAll = r1(outSum + Math.abs(devSum) + Math.abs(cred.filter(r=>r.v<0).reduce((a,b)=>a+b.v,0)));
  const total=r1(inAll-outAll), cashEnd=r1(CF_START+total);
  const cfExcel=()=>downloadExcel("Арта_ДДС_"+label+".xls",["Статья","Сумма, млн ₽"],
    [["Остаток на начало",ru(CF_START,1)],...inRows.map(r=>["Пришло: "+r.l,ru(r.v,1)]),...outRows.map(r=>["Ушло: "+r.l,ru(-r.v,1)]),
     ["Разница по основной работе",ru(opFlow,1)],...dev.map(r=>[r.l,ru(r.v,1)]),...cred.map(r=>[r.l,ru(r.v,1)]),
     ["Изменение за период",ru(total,1)],["Остаток на конец",ru(cashEnd,1)]]);
  const Row=({l,v,hint,bold,color})=>(
    <tr style={bold?{background:"var(--hairsoft)"}:{}}>
      <td style={{fontWeight:bold?800:600,paddingLeft:bold?12:34,fontSize:bold?13.5:12.5,color:bold?"var(--ink)":"var(--muted)"}}>
        {l}{hint && <Hint f={hint} src="1С и банковские выписки"/>}</td>
      <td className="num" style={{fontWeight:bold?800:600,color:color||(v<0?"var(--red-ink)":"var(--green-ink)")}}>
        {v<0?"−":"+"}{ru(Math.abs(v),1)}</td>
    </tr>
  );
  return (
    <div className="grid">

      <div className="c12"><div className="krow n4" style={{marginBottom:0}}>
        <MCard t="Остаток на начало периода" v={mln(CF_START)} demo sub="денежные средства на счетах"
          hint="Остаток денежных средств на расчётных счетах на начало периода. Источник — банковская выписка, которую загружает бухгалтер: прямого доступа к банку у дашборда нет." src={SRC_BANK}/>
        <MCard t="Поступления" v={"+"+mln(inAll)} demo sub={"из них от покупателей "+mln(inSum)} tone="green"
          hint="Все поступления денежных средств за период: оплаты от покупателей (маркетплейсы, сети, дистрибьюторы, экспорт), а также привлечённое финансирование — кредиты и факторинг." src={SRC_BANK}/>
        <MCard t="Выплаты" v={"−"+mln(outAll)} demo sub="поставщики, оплата труда, налоги, финансирование" tone="red"
          hint="Все платежи за период: расчёты с поставщиками, оплата труда, комиссии площадок, логистика, аренда, налоги, приобретение основных средств, погашение кредитов и проценты." src={SRC_BANK}/>
        <MCard t="Остаток на конец периода" v={mln(cashEnd)} demo sub={"изменение "+(total>=0?"+":"−")+ru(Math.abs(total),1)+" млн ₽"} tone={total>=0?"green":"red"}
          hint="Остаток на начало периода плюс поступления минус выплаты." src="Расчёт"/>
      </div></div>

      <Card col={7} title="Отчёт о движении денежных средств" subtitle="по видам деятельности · от остатка на начало до остатка на конец периода"
        right={<button className="btn" onClick={cfExcel}>{I.dl}Excel</button>}>
        <table className="pl">
          <thead><tr><th>Статья</th><th className="num">Млн ₽</th></tr></thead>
          <tbody>
            <tr><td style={{fontWeight:800,paddingLeft:12}}>Остаток денежных средств на начало периода</td><td className="num"><b>{ru(CF_START,1)}</b></td></tr>
            <Row bold l="Поступления от покупателей" v={inSum} hint="Оплаты, поступившие на расчётный счёт от всех каналов сбыта. Отличается от выручки: часть отгрузок оплачивается позже — отсрочка платежа у сетей, удержания площадок."/>
            {inRows.map((r,i)=><Row key={i} l={r.l} v={r.v}/>)}
            <Row bold l="Платежи по операционной деятельности" v={-outSum} hint="Платежи, связанные с основной деятельностью: расчёты с поставщиками, оплата труда, комиссии, логистика, аренда, налоги."/>
            {outRows.map((r,i)=><Row key={i} l={r.l} v={-r.v}/>)}
            <tr style={{background:opFlow<0?"var(--red-soft)":"var(--green-soft)"}}>
              <td style={{fontWeight:800,paddingLeft:12}}>Чистый денежный поток от операционной деятельности
                <Hint f="Поступления от покупателей минус платежи по операционной деятельности. Показывает, покрывают ли поступления от продаж текущие расходы без привлечения заёмных средств." src="Расчёт"/></td>
              <td className="num"><b style={{color:opFlow<0?"var(--red)":"var(--green-ink)"}}>{opFlow<0?"−":"+"}{ru(Math.abs(opFlow),1)}</b></td></tr>
            <Row bold l="Инвестиционная деятельность" v={devSum} hint="Приобретение основных средств: оборудование, транспорт, производственные линии."/>
            {dev.map((r,i)=><Row key={i} l={r.l} v={r.v}/>)}
            <Row bold l="Финансовая деятельность" v={credSum} hint="Привлечение и погашение кредитов и факторинга, проценты и комиссии банка."/>
            {cred.map((r,i)=><Row key={i} l={r.l} v={r.v}/>)}
            <tr className="pl-net"><td style={{fontWeight:800,paddingLeft:12}}>Остаток денежных средств на конец периода</td><td className="num"><b>{ru(cashEnd,1)}</b></td></tr>
          </tbody>
        </table>
      </Card>

      <div className="c5" style={{display:'flex',flexDirection:'column',gap:16}}>
        <Card title="Денежные потоки по видам деятельности" subtitle="вклад каждого вида деятельности в изменение остатка">
          <div style={chartBox(230)}>
            <ResponsiveContainer>
              <BarChart data={[{n:"Операционная",v:+opFlow.toFixed(1)},{n:"Инвестиционная",v:+devSum.toFixed(1)},{n:"Финансовая",v:+credSum.toFixed(1)},{n:"Итого",v:+total.toFixed(1)}]}
                margin={{top:16,right:6,left:-10,bottom:0}}>
                <CartesianGrid {...grid}/>
                <XAxis dataKey="n" tick={{fontSize:9.5}} stroke="#B6BBC4" tickLine={false} axisLine={false} interval={0}/>
                <YAxis tick={ax} stroke="#B6BBC4" tickLine={false} axisLine={false}/>
                <Tooltip contentStyle={tipStyle} formatter={(v)=>[mln(v),"Денежный поток"]}/>
                <ReferenceLine y={0} stroke="#C2C7CF"/>
                <Bar dataKey="v" radius={[4,4,0,0]} barSize={34} isAnimationActive={false}
                  label={{position:"top",formatter:(v)=>ru(v,1),fontSize:10,fontWeight:700,fill:"#6B7280"}}>
                  {[opFlow,devSum,credSum,total].map((v,i)=><Cell key={i} fill={v<0?"#D9553B":i===3?"#7C89F0":"#3E9E6E"}/>)}
                </Bar>
              </BarChart>
            </ResponsiveContainer>
          </div>
        </Card>
        <Card title="Интерпретация">
          <div className={"rec"} style={{background:opFlow<0?"var(--red-soft)":"var(--green-soft)"}}>
            <span className="rtag" style={{background:"#fff",color:opFlow<0?"var(--red-ink)":"var(--green-ink)"}}>ВЫВОД</span>
            <div>{opFlow<0
              ? <>За период сформирована чистая прибыль {mln(T.net)}, при этом операционный денежный поток отрицательный ({ru(opFlow,1)} млн ₽). Причина — разрыв между отгрузкой и оплатой: средства отвлечены в запасы и дебиторскую задолженность, площадки удерживают часть оборота. Дефицит покрывается кредитами и факторингом.</>
              : <>Операционный денежный поток положительный ({"+"+ru(opFlow,1)} млн ₽): поступления от продаж покрывают текущие платежи без привлечения заёмных средств.</>}</div>
          </div>
        </Card>
      </div>
    </div>
  );
}

/* ===================== ЭТАП 2 · ПРОДАЖИ ===================== */

  const execM = T.rev/T.planRev*100, execU = T.units/planUnits*100;
  const chan = SALES_CHANNELS.map(c=>({...c,
    money:T.rev*c.share/100, units:T.units*c.shareUnits/100, plan:T.planRev*c.share/100 }));

              <Line type="monotone" dataKey="plan" stroke="#E5484D" strokeWidth={3} dot={{r:4,fill:"#E5484D"}} isAnimationActive={false}/>
            </ComposedChart>

      <Card col={12} title="План-факт по позициям" subtitle="в штуках · видно, по каким позициям план не выполнен, даже если сумма близка к плановой">

/* ===================== ЭТАП 3 · СИМУЛЯТОР ЦЕНЫ ===================== */
function S3_Sim(){
  const [d,setD]=useState(0);
  const S=PRICE_SIM_GEN;
  const calc=(x)=>{
    const price=S.basePrice*(1+x/100), marginAbs=price-S.baseCost, marginPct=marginAbs/price*100;
    const volume=Math.max(0,S.baseVolume*(1+S.elasticity*(x/100)));
    return {price, marginAbs, marginPct, volume, revenue:price*volume, profit:marginAbs*volume};
  };
  const cur=calc(d), baseProfit=calc(0).profit;
  const profitDelta=(cur.profit-baseProfit)/baseProfit*100;
  const curve=[]; for(let x=-30;x<=30;x+=5){const c=calc(x);curve.push({price:Math.round(c.price),profit:+(c.profit/1e6).toFixed(3)});}
  const scen=[-10,0,10,20].map(x=>({d:x, ...calc(x)}));
  return (
    <div className="grid">
      <Card col={12} gen title="Симулятор цены" subtitle="последствия изменения цены до того, как менять её на площадке">
        <div className="slidehead">
          <div style={{fontSize:13.5,color:'var(--muted)',fontWeight:600}}>Товар: <b style={{color:'var(--ink)'}}>{S.product}</b> · цена {ru(S.basePrice)} ₽ · себестоимость {ru(S.baseCost)} ₽</div>
          <div className="big">{d>0?"+":""}{ru(d)} %</div>
        </div>
        <input type="range" min="-30" max="30" step="1" value={d} onChange={e=>setD(Number(e.target.value))} style={{marginTop:10}}/>
        <div className="krow n4" style={{marginTop:16,marginBottom:0}}>
          <KCard title="Новая цена" value={ru(cur.price)+" ₽"} note={"было "+ru(S.basePrice)+" ₽"}/>
          <KCard title="Маржа" value={ru(cur.marginPct,1)+" %"} chips={<Chip tone="green">точный расчёт</Chip>} note={ru(cur.marginAbs)+" ₽ с единицы"}/>
          <KCard title="Прогноз оборота" value={ru(Math.round(cur.volume))+" шт"} chips={<Chip tone="amber">оценка *</Chip>} note={"было "+ru(S.baseVolume)+" шт"}/>
          <KCard title="Прибыль / мес" value={mln(cur.profit/1e6,2)} chips={<DChip d={+profitDelta.toFixed(1)} unit="%" betterUp={true} label="к базе"/>}/>
        </div>
        <div style={{...chartBox(230),marginTop:18}}>
          <ResponsiveContainer>
            <LineChart data={curve} margin={{top:6,right:12,left:-10,bottom:0}}>
              <CartesianGrid {...grid}/>
              <XAxis type="number" dataKey="price" tick={ax} stroke="#B6BBC4" unit=" ₽" domain={['dataMin','dataMax']} tickLine={false} axisLine={false}/>
              <YAxis tick={ax} stroke="#B6BBC4" unit=" млн" tickLine={false} axisLine={false}/>
              <Tooltip contentStyle={tipStyle} formatter={(v)=>[mln(v,2),"Прибыль / мес"]} labelFormatter={(l)=>"Цена "+ru(l)+" ₽"}/>
              <ReferenceLine x={Math.round(cur.price)} stroke="#0F1419" strokeDasharray="5 5" label={{value:"текущая",position:"top",fontSize:11,fill:"#0F1419"}}/>
              <Line type="monotone" dataKey="profit" stroke="#10B981" strokeWidth={3} dot={{r:3}}/>
            </LineChart>
          </ResponsiveContainer>
        </div>
        <div className="grouphdr">Сценарии</div>
        <table>
          <thead><tr><th>Сценарий</th><th className="num">Цена</th><th className="num">Маржа</th><th className="num">Оборот / мес *</th><th className="num">Прибыль / мес *</th></tr></thead>
          <tbody>
            {scen.map((s,i)=>(
              <tr key={i} style={s.d===0?{background:"var(--hairsoft)"}:{}}>
                <td style={{fontWeight:800}}>{s.d===0?"Текущая":(s.d>0?"+":"")+s.d+" %"}</td>
                <td className="num">{ru(s.price)} ₽</td><td className="num">{ru(s.marginPct,1)} %</td>
                <td className="num">{mln(s.revenue/1e6,2)}</td><td className="num"><b>{mln(s.profit/1e6,2)}</b></td>
              </tr>))}
          </tbody>
        </table>
        <p className="footnote">Маржа — точный расчёт (цена − себестоимость). Оборот и прибыль — оценка по коэффициенту эластичности ({S.elasticity}); точность вырастет на реальных данных продаж.</p>
      </Card>
    </div>
  );
}

/* ===================== ЭТАП 3 · ПРОГНОЗ СПРОСА ===================== */
function S3_Demand(){
  const data=DEMAND_FORECAST_GEN.map(d=>({...d}));
  let li=-1; data.forEach((d,i)=>{ if(d.actual!=null) li=i; });
  if(li>=0){ data[li].forecast=data[li].actual; data[li].low=data[li].actual; data[li].high=data[li].actual; }
  const fc=DEMAND_FORECAST_GEN.filter(r=>r.forecast!=null);
  return (
    <div className="grid">
      <Card col={8} gen title="Прогноз спроса" subtitle="факт (янв–апр, реальная выручка) + прогнозная зона (май–июль) с доверительным интервалом, млн ₽">
        <div style={chartBox(300)}>
          <ResponsiveContainer>
            <ComposedChart data={data} margin={{top:6,right:10,left:-14,bottom:0}}>
              <CartesianGrid {...grid}/>
              <XAxis dataKey="month" tick={ax} stroke="#B6BBC4" tickLine={false} axisLine={false}/>
              <YAxis tick={ax} stroke="#B6BBC4" tickLine={false} axisLine={false}/>
              <Tooltip contentStyle={tipStyle} formatter={(v,n)=>{const m={actual:"Факт",forecast:"Прогноз",high:"Верхняя граница",low:"Нижняя граница"};return v==null?["—",m[n]]:[mln(v),m[n]];}}/>
              <Area type="monotone" dataKey="high" stroke="none" fill="#10B981" fillOpacity={0.13} connectNulls/>
              <Area type="monotone" dataKey="low" stroke="none" fill="#F4F5F7" fillOpacity={1} connectNulls/>
              <Line type="monotone" dataKey="actual" stroke="#0F1419" strokeWidth={3} dot={{r:3}} connectNulls/>
              <Line type="monotone" dataKey="forecast" stroke="#10B981" strokeWidth={3} strokeDasharray="7 5" dot={{r:3}} connectNulls/>
            </ComposedChart>
          </ResponsiveContainer>
        </div>
        <div className="leg"><span><i style={{background:"#0F1419"}}/>Факт</span><span><i style={{background:"#10B981"}}/>Прогноз</span></div>
      </Card>
      <Card col={4} gen title="Прогноз по сценариям" subtitle="риск дефицита и избытка, млн ₽">
        <table>
          <thead><tr><th>Месяц</th><th className="num">Низ</th><th className="num">База</th><th className="num">Верх</th></tr></thead>
          <tbody>
            {fc.map((r,i)=>(
              <tr key={i}><td style={{fontWeight:700}}>{r.month}</td><td className="num">{ru(r.low)}</td><td className="num"><b>{ru(r.forecast)}</b></td><td className="num">{ru(r.high)}</td></tr>))}
          </tbody>
        </table>
        <p className="footnote">Нижняя граница — план без риска избытка; верхняя — закладка мощностей под пик.</p>
      </Card>
      <Card col={12} title="Наша позиция по прогнозированию">
        <div className="rec" style={{background:"var(--mint-soft)"}}><span className="rtag" style={{background:"#fff",color:"var(--mint-deep)"}}>МЕТОД</span>
          <div>Прогноз строится на инструментах, устойчивых к нерегулярным факторам (промо, сезонные вводы, нестабильные планы сетей). Чисто статистическое прогнозирование спроса в условиях частых «чёрных лебедей» не применяется — модель консервативна.</div></div>
      </Card>
    </div>
  );
}

/* ===================== ЭТАП 3 · ПРОГНОЗ ПРОДАЖ НА МЕСЯЦ ===================== */
function S3_MonthForecast(){
  const base=MONTH_FORECAST_GEN.reduce((a,b)=>a+b.base,0);
  const low=MONTH_FORECAST_GEN.reduce((a,b)=>a+b.low,0);
  const high=MONTH_FORECAST_GEN.reduce((a,b)=>a+b.high,0);
  const delta=(base-PL_MONTHLY[3].revenue)/PL_MONTHLY[3].revenue*100;
  return (
    <div className="grid">
      <div className="c12"><div className="krow n4" style={{marginBottom:0}}>
        <KCard gen title="Прогноз выручки · июнь" value={mln(base)} chips={<DChip d={+delta.toFixed(1)} unit="%" betterUp={true} label="к апрелю"/>} note="базовый сценарий"/>
        <KCard gen title="Нижняя граница" value={mln(low)} note="консервативный план"/>
        <KCard gen title="Верхняя граница" value={mln(high)} note="закладка мощностей"/>
        <KCard gen title="Доверит. интервал" value={"±"+ru((high-low)/2/base*100,0)+" %"} note="разброс прогноза"/>
      </div></div>
      <Card col={7} gen title="Прогноз продаж на месяц по категориям" subtitle="июнь 2026 · база и границы, млн ₽">
        <div style={chartBox(280)}>
          <ResponsiveContainer>
            <BarChart data={MONTH_FORECAST_GEN} margin={{top:6,right:10,left:-14,bottom:0}} barGap={4}>
              <CartesianGrid {...grid} vertical={false}/>
              <XAxis dataKey="category" tick={{fontSize:11.5,fontWeight:700}} stroke="#B6BBC4" tickLine={false} axisLine={false}/>
              <YAxis tick={ax} stroke="#B6BBC4" tickLine={false} axisLine={false}/>
              <Tooltip contentStyle={tipStyle} formatter={(v,n)=>[mln(v), n==="low"?"Низ":n==="base"?"База":"Верх"]}/>
              <Bar dataKey="low" fill="#C9CED6" radius={[6,6,0,0]} barSize={20} isAnimationActive={false}/>
              <Bar dataKey="base" fill="#0F1419" radius={[6,6,0,0]} barSize={20} isAnimationActive={false} label={{position:"top",formatter:(v)=>ru(v,1),fontSize:11,fontWeight:800,fill:"#0F1419"}}/>
              <Bar dataKey="high" fill="#10B981" radius={[6,6,0,0]} barSize={20} isAnimationActive={false}/>
            </BarChart>
          </ResponsiveContainer>
        </div>
        <div className="leg"><span><i style={{background:"#C9CED6"}}/>Низ</span><span><i style={{background:"#0F1419"}}/>База</span><span><i style={{background:"#10B981"}}/>Верх</span></div>
      </Card>
      <Card col={5} gen title="Детализация прогноза" subtitle="млн ₽ · от чего отталкиваться в плане">
        <table>
          <thead><tr><th>Категория</th><th className="num">Низ</th><th className="num">База</th><th className="num">Верх</th></tr></thead>
          <tbody>
            {MONTH_FORECAST_GEN.map((r,i)=>(
              <tr key={i}><td style={{fontWeight:700}}>{r.category}</td><td className="num">{ru(r.low,1)}</td><td className="num"><b>{ru(r.base,1)}</b></td><td className="num">{ru(r.high,1)}</td></tr>))}
            <tr style={{background:"var(--hairsoft)"}}><td style={{fontWeight:800}}>Итого</td><td className="num"><b>{ru(low,1)}</b></td><td className="num"><b>{ru(base,1)}</b></td><td className="num"><b>{ru(high,1)}</b></td></tr>
          </tbody>
        </table>
        <p className="footnote">База — ориентир для плана производства; низ страхует от избытка, верх — от дефицита под пик.</p>
      </Card>
    </div>
  );
}

/* ===================== ЭТАП 3 · ПРОГНОЗ ЗАКУПОК ===================== */
function S3_Purchase(){
  const [node,setNode]=useState("plan");
  const longR=PURCHASE_FORECAST_GEN.filter(r=>r.type==="долгое");
  const fastR=PURCHASE_FORECAST_GEN.filter(r=>r.type==="быстрое");
  const rows=(arr)=>arr.map((r,i)=>(
    <tr key={i}><td style={{fontWeight:700}}>{r.material}</td><td className="num">{ru(r.current)} кг</td><td className="num">{ru(r.forecast)} кг</td><td className="num"><b>{ru(r.order)} кг</b></td>
      <td>{r.urgency==="under_order"?<Chip tone="red">дозаказ</Chip>:<Chip tone="amber">буфер</Chip>}</td></tr>));
  return (
    <div className="grid">
      <Card col={12} gen title="Прогноз потребности в сырье" subtitle="на горизонт с учётом сезонности · разделение по типу поставки">
        <div className="grouphdr">Долгое сырьё — импорт, спецпозиции (страховой буфер по прогнозу)</div>
        <table><thead><tr><th>Материал</th><th className="num">Текущий расход</th><th className="num">Прогноз</th><th className="num">К заказу</th><th>Срочность</th></tr></thead><tbody>{rows(longR)}</tbody></table>
        <div className="grouphdr">Быстрое сырьё — локальное (под заказ)</div>
        <table><thead><tr><th>Материал</th><th className="num">Текущий расход</th><th className="num">Прогноз</th><th className="num">К заказу</th><th>Срочность</th></tr></thead><tbody>{rows(fastR)}</tbody></table>
      </Card>
      <Card col={12} gen title="Связка: План → Производство → Сырьё" subtitle="изменение в плане продаж подсвечивает последствия по цепочке">
        <div className="chain">
          <div className={"cnode cn-a"+(node==="plan"?" hot":"")} onMouseEnter={()=>setNode("plan")}>
            <div className="tag" style={{color:'var(--lilac-ink)'}}>ПЛАН ПРОДАЖ</div>
            <h4>Промо +40% · «Приправа для курицы 330г»</h4>
            <p>Маркетинг ставит акцию с 15.06. Спрос вырастет — нужно проверить, выдержит ли цепочка.</p>
          </div>
          <div className="carrow">→</div>
          <div className={"cnode cn-b"+(node==="prod"?" hot":"")} onMouseEnter={()=>setNode("prod")}>
            <div className="tag" style={{color:'var(--blue-ink)'}}>ПРОИЗВОДСТВО</div>
            <h4>+58 партий · загрузка линии «Самокат» 92%</h4>
            <p>Требуется доп. смена 14–15.06. Риск простоя других SKU — пересборка графика.</p>
          </div>
          <div className="carrow">→</div>
          <div className={"cnode cn-c"+(node==="raw"?" hot":"")} onMouseEnter={()=>setNode("raw")}>
            <div className="tag" style={{color:'var(--amber-ink)'}}>СЫРЬЁ И УПАКОВКА</div>
            <h4>Паприка +320 кг · этикетка +18 тыс шт</h4>
            <p>Заказ поставщику до 09.06, иначе срыв промо. Этикетка — узкое место.</p>
          </div>
        </div>
        <p className="footnote">Наведите на блок, чтобы увидеть, как изменение плана продаж распространяется по цепочке до закупок сырья.</p>
      </Card>
      <Card col={12} gen title="Рекомендации по заказам">
        <Recs items={[
          {tone:"red", text:"Соль: оформить дозаказ 1 250 кг в ближайшие дни (быстрая локальная поставка)."},
          {tone:"amber", text:"Перец чёрный и куркума (импорт): заложить буфер 450 и 210 кг — заказ заранее с учётом срока поставки."},
          {tone:"blue", text:"Под промо «Приправа для курицы» заказать паприку +320 кг и этикетку +18 тыс шт до 09.06."},
        ]}/>
      </Card>
    </div>
  );
}

/* ===================== НАВИГАЦИЯ + APP ===================== */
const STAGES=[
  { id:1, name:"Этап 1 · Маркетплейсы", icon:I.cart, subs:[
    { key:"home", name:"Главная", C:S1_Home, badge:"54,1 млн ₽ оборот · май", crumb:"Главная" },
    { key:"products", name:"Товарная аналитика", short:"Товары", gen:true, C:S1_Products, badge:"ABC · каналы · категории", crumb:"Товарная аналитика" },
    { key:"orders", name:"Заказы", gen:true, C:S1_Orders, badge:"пик 18:00–21:00 · спрос по часам, 3 площадки", crumb:"Заказы" },
    { key:"unit", name:"Юнит-экономика SKU", short:"Юнит-экономика", gen:true, C:S1_Unit, badge:"прибыль с каждой единицы", crumb:"Юнит-экономика" },
    { key:"ads", name:"Реклама", C:S1_Ads, badge:"бюджет 8 млн ₽ · ×11 за год", crumb:"Реклама" },
    { key:"prices", name:"Цены конкурентов", short:"Цены", gen:true, C:S1_Prices, badge:"2 сигнала демпинга", crumb:"Цены конкурентов" },
    { key:"channels", name:"Сравнение каналов", short:"Каналы", C:S1_Channels, badge:"Ozon 73% · WB 43% · ЯМ 67%", crumb:"Сравнение каналов" },
    { key:"stock", name:"Склад", gen:true, C:S1_Stock, badge:"2 SKU на исходе · 3,6 млн ₽ в излишках", crumb:"Склад" },
  ]},
  { id:2, name:"Этап 2 · Управленческий контур", icon:I.pulse, subs:[
    { key:"overview", name:"Главное", C:S2_Overview, crumb:"Главное" },
    { key:"pl", name:"P&L и рентабельность", short:"P&L", C:S2_PL, badge:"полная структура 1С · раскрытие", crumb:"P&L" },
    { key:"cf", name:"ДДС", C:S2_CashFlow, badge:"движение денег по статьям", crumb:"ДДС" },
    { key:"sales", name:"Продажи", C:S2_Sales, badge:"план-факт · каналы · бренд/СТМ · штуки и деньги", crumb:"Продажи" },
  ]},
  { id:3, name:"Этап 3 · Прогнозная аналитика", icon:I.crystal, subs:[
    { key:"sim", name:"Симулятор цены", gen:true, C:S3_Sim, badge:"цена → маржа → прибыль", crumb:"Симулятор цены" },
    { key:"demand", name:"Прогноз спроса", gen:true, C:S3_Demand, badge:"горизонт 3 месяца", crumb:"Прогноз спроса" },
    { key:"monthfc", name:"Прогноз продаж на месяц", gen:true, C:S3_MonthForecast, badge:"июнь · 4,4 млн ₽ база", crumb:"Прогноз на месяц" },
    { key:"purchase", name:"Прогноз закупок", gen:true, C:S3_Purchase, badge:"сырьё под план и сезонность", crumb:"Прогноз закупок" },
  ]},
];

function App(){
  const [stage,setStage]=useState(2);
  const [subKey,setSubKey]=useState("overview");
  const stageObj=STAGES.find(s=>s.id===stage);
  const subObj=stageObj.subs.find(s=>s.key===subKey) || stageObj.subs[0];
  const Active=subObj.C;
  /* период — общий, но набор пресетов зависит от этапа: этап 1 (маркетплейсы) — дни, этап 2/3 (управленка) — месяцы */
  const init=ordRangeFor("ytd");
  const [pk,setPk]=useState("ytd");
  const [from,setFrom]=useState(init.from);
  const [to,setTo]=useState(init.to);
  const setPreset=(k)=>{ setPk(k); if(k!=="custom"){ const r=ordRangeFor(k); setFrom(r.from); setTo(r.to); } };
  const setRange=(f,t)=>{ setFrom(f); setTo(t); setPk("custom"); };
  const stagePeriod=(id)=> id===1 ? "today" : "ytd";      // управленка по умолчанию — 4 мес 2026
  const selectStage=(id)=>{ if(id!==stage) setPreset(stagePeriod(id)); setStage(id); setSubKey(STAGES.find(s=>s.id===id).subs[0].key); window.scrollTo(0,0); };
  const go=(stageId,key)=>{ if(stageId!==stage) setPreset(stagePeriod(stageId)); setStage(stageId); setSubKey(key); window.scrollTo(0,0); };
  const periodOpts = stage===1 ? ORD_PERIODS.filter(p=>!p.from) : ORD_PERIODS.filter(p=>p.from || p.k==="custom");
  const curP=ORD_PERIODS.find(p=>p.k===pk)||{};
  const period={ pk, from, to,
    days: (pk==="custom"||curP.from) ? ordDaysBetween(from,to) : (curP.days||1),
    isToday: pk==="today",
    label: pk==="today"?"Сегодня" : pk==="yest"?"Вчера" : curP.from ? curP.n : ruDate(from)+" — "+ruDate(to) };
  return (
    <div className="shell">
      {/* левая панель — этапы */}
      <div className="rail">
        {STAGES.filter(s=>s.id===2).map(s=>(
          <button key={s.id} className={"railbtn"+(stage===s.id?" active":"")} onClick={()=>selectStage(s.id)}>
            {s.icon}<span className="tip">{s.name}</span>
          </button>))}
      </div>

      {/* верхняя панель */}
      <div className="topbar">
        <div className="logo">АГ</div>
        <div className="nav">
          {stageObj.subs.map(sb=>(
            <button key={sb.key} className={"navpill"+(subKey===sb.key?" active":"")} onClick={()=>{setSubKey(sb.key);window.scrollTo(0,0);}}>
              {sb.short||sb.name}{sb.gen && <span className="ast">*</span>}
            </button>))}
        </div>
        <div className="search">{I.search}Найти SKU, канал, отчёт…<span className="kbd">⌘K</span></div>
        <div className="live"><span className="dot"/>Live</div>
      </div>

      {/* хлебные крошки + шапка раздела */}
      <div className="crumbs">
        Главная <span>›</span> <b>{stageObj.name}</b> <span>›</span> {subObj.crumb}
        <span className="sync"><i/>Синхр. 2 мин назад</span>
      </div>
      <div className="pagehead">
        <h1>{subObj.name}{subObj.gen && <span className="star" style={{fontSize:'.45em'}}>*</span>}
          {subObj.badge && <span className="limebadge"><i/>{subObj.badge}</span>}</h1>
        <div className="headctl">
          <div className="datepill">
            {I.cal}<span className="lbl">За период:</span>
            <select className="selbare" value={pk} onChange={e=>setPreset(e.target.value)}>
              {periodOpts.map(p=><option key={p.k} value={p.k}>{p.n}</option>)}
            </select>
          </div>
          <div className="datepill">
            <input className="dateinp" type="date" value={from} max={to} onChange={e=>setRange(e.target.value,to)}/>
            <span style={{color:'var(--muted)'}}>—</span>
            <input className="dateinp" type="date" value={to} min={from} onChange={e=>setRange(from,e.target.value)}/>
          </div>
          <button className="exportbtn">{I.dl}Экспорт отчёта</button>
        </div>
      </div>

      <Active go={go} period={period}/>

      <p className="pgnote">Значения и разделы со звёздочкой (*) — сгенерированные данные для демонстрации макета. Остальные показатели — из отчётности Арта Групп.<br/>Цвета каналов едины по всему дашборду: Ozon — синий · Wildberries — сиреневый · Яндекс Маркет — жёлтый.</p>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
